# ============================================================
# Nginx konfig z HTTPS (self-signed cert) dla Warsztat App
# Plik: /etc/nginx/sites-available/warsztat
# ============================================================

# Przekierowanie HTTP -> HTTPS
server {
    listen 80;
    server_name _;  # <- wpisz tutaj swoje IP lub domenę, np: 192.168.1.100
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;  # <- wpisz tutaj swoje IP lub domenę

    # Certyfikaty SSL — wygeneruj je komendą poniżej lub użyj Let's Encrypt
    ssl_certificate     /etc/ssl/certs/warsztat.crt;
    ssl_certificate_key /etc/ssl/private/warsztat.key;

    # Dobre ustawienia SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — przeglądarka pamięta HTTPS przez rok
    add_header Strict-Transport-Security "max-age=31536000" always;

    # PWA headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # Proxy do Node.js backendu
    location /api/ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend (statyczne pliki po `npm run build`)
    root /var/www/warsztat/frontend/dist;
    index index.html;

    # Service worker — nie cachuj!
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        expires 0;
    }

    # PWA manifest
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        expires 0;
    }

    # SPA fallback — wszystkie ścieżki -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
